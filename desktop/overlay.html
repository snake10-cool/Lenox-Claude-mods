<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Snake-Desktop</title>
<style>
  :root { --g: 1; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .lage, .lage svg { position: fixed; inset: 0; width: 100%; height: 100%; }
  .lage { transition: opacity 1.2s ease; }
  .spiegel { transform: scaleX(-1); }
  .sway { scale: var(--g); }
  /* Auf dem Desktop nur die bewegten Teile: kein Himmel, keine Hügel, Bäume oder Wellen. */
  .lage svg > rect:first-of-type, .hill, .pile, .snowg, .p1, .p2, .w1, .w2, .w3, .moon, .moonbite, .logs, .fl,
  ellipse, circle[fill], .sonne, .wolke, .sand, .d1, .d2, .kaktus, .strahl, .flash, .kabel, .licht, .tanne, .stamm, .stern, .mond { display: none; }
  .star, path[stroke-width="10"], g[transform^="translate(160 960)"], g[transform^="translate(1440 960)"] { display: none; }
  .kb, .kb2, .stiel, .gesicht, .blitz { display: none; }
  .hz { display: none; }
  .verborgen { display: none; }
  /* Blätter, die unten liegen bleiben */
  #boden { position: fixed; inset: 0; pointer-events: none; }
  .liegt { position: absolute; width: 34px; height: 34px; transition: transform .9s cubic-bezier(.22,1.25,.4,1), opacity 2s ease; }
  .liegt svg { width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>
<div id="szene" class="lage"></div>
<div id="szene2" class="lage spiegel"></div>
<div id="boden"></div>
<script>
  const box = document.getElementById('szene')
  const box2 = document.getElementById('szene2')
  const boden = document.getElementById('boden')
  const DECKKRAFT = { dezent: 0.45, normal: 0.75, kraeftig: 1 }
  const GROESSE = { klein: 0.7, mittel: 1, gross: 1.45 }
  const RADIUS = 55        // ab hier spürt ein Blatt die Maus (Pixel)
  const FANG = 22          // so nah: das Blatt kann angeklickt werden
  const MAX_LIEGEN = 45
  let teile = []
  let svg = null
  let opt = { wind: true, sammeln: true }
  let maus = { x: -999, y: -999, vx: 0, vy: 0, zeit: 0 }
  let gefangen = null
  let boe = { kraft: 0, rest: 0, naechste: performance.now() + 20000 }
  let frame = 0

  window.snake.onSzene(({ svg: quelle, staerke, groesse, menge, wind, sammeln }) => {
    opt = { wind: wind !== false, sammeln: sammeln !== false }
    document.documentElement.style.setProperty('--g', String(GROESSE[groesse] ?? 1))
    box.innerHTML = quelle
    box2.innerHTML = menge === 'viel' ? quelle : ''
    for (const b of [box, box2]) b.style.opacity = String(DECKKRAFT[staerke] ?? 0.75)
    svg = box.querySelector('svg')
    teile = []
    for (const [b, spiegel] of [[box, false], [box2, true]]) {
      ;[...b.querySelectorAll('.mv')].forEach((el, i) => {
        if (menge === 'wenig' && i % 3 !== 0) { el.classList.add('verborgen'); return }
        teile.push({ el, bod: el.querySelector('.bod') || el, spiegel, ox: 0, oy: 0, vx: 0, vy: 0, rot: 0, vr: 0, cy: 0 })
      })
    }
    if (!opt.sammeln) boden.innerHTML = ''
  })

  window.addEventListener('mousemove', e => {
    const jetzt = performance.now()
    const dt = Math.max(8, jetzt - maus.zeit)
    maus = { x: e.clientX, y: e.clientY, vx: (e.clientX - maus.x) / dt * 16, vy: (e.clientY - maus.y) / dt * 16, zeit: jetzt }
    // Liegende Blätter hüpfen kurz hoch, wenn die Maus vorbeistreicht.
    for (const l of boden.children) {
      const r = l.getBoundingClientRect()
      if (Math.hypot(r.x + r.width / 2 - maus.x, r.y + r.height / 2 - maus.y) < 40 && !l.dataset.huepft) {
        l.dataset.huepft = '1'
        const basis = l.dataset.basis
        l.style.transform = `${basis} translate(${maus.vx > 0 ? 18 : -18}px, -26px) rotate(${maus.vx > 0 ? 40 : -40}deg)`
        setTimeout(() => { l.style.transform = basis; delete l.dataset.huepft }, 650)
      }
    }
  })

  // Klick auf ein Blatt: kräftiger Schubs weg von der Maus, mit Drehung.
  window.addEventListener('mousedown', () => {
    if (gefangen === null) return
    const t = gefangen
    const r = t.bod.getBoundingClientRect()
    const dx = r.x + r.width / 2 - maus.x, dy = r.y + r.height / 2 - maus.y
    const l = Math.hypot(dx, dy) || 1
    t.vx += (dx / l) * 14
    t.vy += (dy / l) * 10 - 4
    t.vr += (dx >= 0 ? 1 : -1) * 18
    loslassen()
  })

  function loslassen() {
    gefangen = null
    window.snake.fangen(false)
  }

  function hinlegen(t, x) {
    if (boden.children.length >= MAX_LIEGEN) {
      const alt = boden.firstElementChild
      alt.style.opacity = '0'
      setTimeout(() => alt.remove(), 2000)
    }
    const form = t.bod.querySelector('path, circle, polygon')
    if (!form) return
    const d = document.createElement('div')
    d.className = 'liegt'
    const groesse = 34 * (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--g')) || 1)
    d.style.width = d.style.height = `${groesse}px`
    d.style.left = `${x - groesse / 2}px`
    d.style.top = `${window.innerHeight - groesse * (0.55 + Math.random() * 0.25)}px`
    const basis = `rotate(${Math.round(Math.random() * 180 - 90)}deg)`
    d.dataset.basis = basis
    d.style.transform = basis
    d.innerHTML = `<svg viewBox="-22 -22 44 44">${form.outerHTML}</svg>`
    boden.appendChild(d)
    setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 2000) }, 180000)
  }

  function schritt() {
    frame++
    const jetzt = performance.now()
    const aktiv = jetzt - maus.zeit < 1500
    const skala = svg ? svg.getScreenCTM()?.a || 1 : 1
    const pruefeBoden = opt.sammeln && frame % 4 === 0
    let naechstes = null, naechsteD = Infinity

    // Windböe: ab und zu ein sanfter Stoß für alle.
    if (opt.wind && jetzt > boe.naechste) {
      boe = { kraft: (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.35), rest: 90, naechste: jetzt + 20000 + Math.random() * 40000 }
    }
    const windJetzt = boe.rest > 0 ? boe.kraft * Math.sin((boe.rest / 90) * Math.PI) : 0
    if (boe.rest > 0) boe.rest--

    for (const t of teile) {
      const richtung = t.spiegel ? -1 : 1
      if (aktiv || pruefeBoden) {
        const r = t.bod.getBoundingClientRect()
        const cx = r.x + r.width / 2, cy = r.y + r.height / 2
        if (pruefeBoden) {
          const linie = window.innerHeight - 6
          if (t.cy > 0 && t.cy < linie && cy >= linie && cx > 0 && cx < window.innerWidth) hinlegen(t, cx)
          t.cy = cy
        }
        if (aktiv) {
          const d = Math.hypot(cx - maus.x, cy - maus.y)
          if (d < naechsteD) { naechsteD = d; naechstes = t }
          if (d < RADIUS) {
            const tempo = Math.hypot(maus.vx, maus.vy)
            const rx = tempo > 0.5 ? maus.vx / tempo : (cx - maus.x) / (d || 1)
            const ry = tempo > 0.5 ? maus.vy / tempo : (cy - maus.y) / (d || 1)
            const kraft = (1 - d / RADIUS) * Math.min(1.6, 0.5 + tempo * 0.08)
            t.vx += rx * kraft * richtung
            t.vy += ry * kraft * 0.6
            t.vr += rx * kraft * 1.5
          }
        }
      }
      if (windJetzt !== 0) { t.vx += windJetzt * richtung; t.vr += windJetzt * 0.8 }
      t.vx *= 0.9; t.vy *= 0.9; t.vr *= 0.9
      t.ox = (t.ox + t.vx) * 0.997
      t.oy = (t.oy + t.vy) * 0.997
      t.rot = (t.rot + t.vr) * 0.995
      if (Math.abs(t.ox) + Math.abs(t.oy) + Math.abs(t.rot) > 0.05) {
        t.el.style.transform = `translate(${(t.ox / skala).toFixed(2)}px, ${(t.oy / skala).toFixed(2)}px)`
        t.bod.style.transformBox = 'fill-box'
        t.bod.style.transformOrigin = 'center'
        t.bod.style.transform = `rotate(${t.rot.toFixed(1)}deg)`
      }
    }

    // Nur direkt über einem Blatt nimmt das Fenster Klicks an, sonst gehen sie durch.
    const sollFangen = aktiv && naechstes !== null && naechsteD < FANG
    if (sollFangen && gefangen !== naechstes) {
      gefangen = naechstes
      window.snake.fangen(true)
    } else if (!sollFangen && gefangen !== null) {
      loslassen()
    }
    requestAnimationFrame(schritt)
  }
  requestAnimationFrame(schritt)
</script>
</body>
</html>
