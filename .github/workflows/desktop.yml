name: Snake-Desktop bauen

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'plugins/snake-hub/hooks/scenes.ts', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run scenes
      - run: npm run dist
      - name: Version lesen
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Versions-Release (für das Selbst-Update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.version }}
          name: Snake-Desktop ${{ steps.v.outputs.version }}
          body: |
            Snake-Desktop ${{ steps.v.outputs.version }} für Windows. Ab Version 0.4 aktualisiert sich das Programm selbst.
            - Snake-Desktop-Setup.exe: installieren
            - Snake-Desktop-Portable.exe: ohne Installation starten (aktualisiert sich nicht selbst)
          files: |
            desktop/dist/Snake-Desktop-Setup.exe
            desktop/dist/Snake-Desktop-Portable.exe
          make_latest: true
      - name: Fester Link "desktop" (immer die neueste Version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop
          name: Snake-Desktop (neueste Version)
          body: |
            Immer die neueste Version (${{ steps.v.outputs.version }}). Ab Version 0.4 aktualisiert sich Snake-Desktop selbst.
            - Snake-Desktop-Setup.exe: installieren (empfohlen, mit Selbst-Update)
            - Snake-Desktop-Portable.exe: ohne Installation starten
          files: |
            desktop/dist/Snake-Desktop-Setup.exe
            desktop/dist/Snake-Desktop-Portable.exe
          make_latest: false
